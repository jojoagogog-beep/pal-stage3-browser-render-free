name = "PAL Vendor Symbol Guard"
application_url = "https://pal-shopify-batch50-gateway.onrender.com/pal-vendor-symbol-guard/app"
embedded = true
client_id = "819fd4c15500700c42d593971c914cab"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://pal-shopify-batch50-gateway.onrender.com/pal-vendor-symbol-guard/auth/callback",
  "https://pal-shopify-batch50-gateway.onrender.com/pal-vendor-symbol-guard/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/pal-vendor-symbol-guard/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/pal-vendor-symbol-guard/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/pal-vendor-symbol-guard/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/pal-vendor-symbol-guard/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/pal-vendor-symbol-guard/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
