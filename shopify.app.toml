name = "PAL Price Precision Guard"
application_url = "https://pal-price-precision-guard.onrender.com/app"
embedded = true
client_id = "898c5978b47c2be2d5de115a6b9c5005"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://pal-price-precision-guard.onrender.com/auth/callback",
  "https://pal-price-precision-guard.onrender.com/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
