embedded = true
client_id = "421354e9c5aa495df90cd92619ec4b5c"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://pal-barcode-checksum-guard.onrender.com/auth/callback",
  "https://pal-barcode-checksum-guard.onrender.com/auth/shopify/callback"
]

