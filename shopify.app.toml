name = "PAL Description Email Guard"
application_url = "https://pal-shopify-batch50-gateway.onrender.com/pal-description-email-guard/app"
embedded = true
client_id = "f6dd6b8348eee9f7c4eba2713e26d514"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://pal-shopify-batch50-gateway.onrender.com/pal-description-email-guard/auth/callback",
  "https://pal-shopify-batch50-gateway.onrender.com/pal-description-email-guard/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/pal-description-email-guard/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/pal-description-email-guard/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/pal-description-email-guard/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/pal-description-email-guard/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/pal-description-email-guard/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
